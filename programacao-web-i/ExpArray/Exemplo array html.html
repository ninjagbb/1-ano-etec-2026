<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Exercício: Array de Frutas</title>
</head>
<body>
  <h2>Digite o nome de 5 frutas</h2>

  <!-- Formulário para o usuário inserir os nomes das frutas -->
  <form id="frutasForm">
    <input type="text" id="fruta1" placeholder="Fruta 1" required /><br />
    <input type="text" id="fruta2" placeholder="Fruta 2" required /><br />
    <input type="text" id="fruta3" placeholder="Fruta 3" required /><br />
    <input type="text" id="fruta4" placeholder="Fruta 4" required /><br />
    <input type="text" id="fruta5" placeholder="Fruta 5" required /><br />
    <button type="submit">Enviar</button>
    <button id="limparBtn" type="button">Limpar lista</button>
    
  </form>

  <!-- Local onde as frutas serão exibidas -->
  <div id="resultado"></div>

<script src="_js/script.js"></script>

</body>
</html>
